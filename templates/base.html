<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}MiniRed{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if yo %}
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="{{ url_for('muro') }}">
        <span class="logo-mark">m</span>
        <span class="logo-text">MiniRed</span>
      </a>

      <nav class="nav">
        <a href="{{ url_for('muro') }}" title="Muro">Muro</a>
        <a href="{{ url_for('usuarios') }}" title="Usuarios">Usuarios</a>
        <a href="{{ url_for('sqli_lab') }}" title="Lab SQLi">Lab SQLi</a>
      </nav>

      <div class="topbar-right">
        <form method="post" action="{{ url_for('cambiar_modo') }}" class="inline">
          <button type="submit" class="pill {{ 'pill-seguro' if seguro else 'pill-vuln' }}"
                  title="Clic para cambiar de modo">
            <span class="dot"></span>{{ 'SEGURO' if seguro else 'VULNERABLE' }}
          </button>
        </form>
        <form method="post" action="{{ url_for('reset_db') }}" class="inline">
          <button type="submit" class="icon-btn" title="Reiniciar base de datos">&#8635;</button>
        </form>

        <div class="user-menu">
          <a href="{{ url_for('ver_perfil') }}" class="avatar" title="Mi perfil">{{ yo.display_name[0]|upper }}</a>
          <div class="user-name">
            <a href="{{ url_for('ver_perfil') }}">{{ yo.display_name }}</a>
            <small>id {{ yo.id }}</small>
          </div>
          <form method="post" action="{{ url_for('logout') }}" class="inline">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="icon-btn" title="Salir">&#x23FB;</button>
          </form>
        </div>
      </div>
    </div>
  </header>
  {% endif %}

  <main class="{{ 'with-topbar' if yo else '' }}">
    {% with msgs = get_flashed_messages() %}
      {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
