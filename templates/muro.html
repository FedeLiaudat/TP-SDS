{% extends "base.html" %}
{% block title %}Muro - MiniRed{% endblock %}
{% block content %}
<div class="feed">

  <div class="card compose">
    <form method="post" action="{{ url_for('publicar') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="compose-top">
        <span class="avatar">{{ yo.display_name[0]|upper }}</span>
        <textarea name="content" rows="2" placeholder="¿Qué estás pensando, {{ yo.display_name }}?" required></textarea>
      </div>
      <div class="compose-actions">
        <button type="submit">Publicar</button>
      </div>
    </form>
  </div>

  {% for p in posts %}
  <article class="card post">
    <div class="post-head">
      <a href="{{ url_for('ver_perfil', id=p.autor_id) }}" class="avatar">{{ p.display_name[0]|upper }}</a>
      <div class="post-head-text">
        <a href="{{ url_for('ver_perfil', id=p.autor_id) }}" class="post-author">{{ p.display_name }}</a>
        <small class="post-meta">{{ p.created_at }} · #{{ p.id }}</small>
      </div>
    </div>
    <div class="post-body">
      {% if seguro %}
        {# [FIX-XSS] Jinja escapa el contenido: <script> se muestra como texto #}
        {{ p.content }}
      {% else %}
        {# [VULN-XSS] |safe desactiva el escapado: el HTML/JS del usuario se ejecuta #}
        {{ p.content|safe }}
      {% endif %}
    </div>
  </article>
  {% endfor %}

</div>
{% endblock %}
