{% extends "base.html" %}
{% block title %}Usuarios - MiniRed{% endblock %}
{% block content %}
<div class="tarjeta">
  <h1>Usuarios</h1>
  <table>
    <tr><th>ID</th><th>Usuario</th><th>Nombre</th><th></th></tr>
    {% for u in lista %}
    <tr>
      <td>{{ u.id }}</td><td>{{ u.username }}</td><td>{{ u.display_name }}</td>
      <td><a href="{{ url_for('ver_perfil', id=u.id) }}">ver perfil</a></td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
